name: UniCal Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_message:
        description: 'Invia anche un messaggio Telegram di prova'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: unical-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa dipendenze
        run: python -m pip install -r requirements.txt
      - name: Test automatici
        run: python -m unittest discover -s tests -v
      - name: Controlla UniCal e notifica
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_message }}
        run: |
          if [ "$TEST_MESSAGE" = "true" ]; then
            python monitor.py --test-message
          else
            python monitor.py
          fi
      - name: Salva stato persistente
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna stato monitor UniCal"
            git push
          fi
